# PHI CRM — Odoo Community + PostgreSQL
# Feito para DEPLOY VIA GIT no EasyPanel (Fonte = Git → docker-compose.yml).
#
# Preencher no EasyPanel:
#   URL do Repositório : git@github.com:olavofranzin/phi.git   (SSH — repo é privado)
#   Ramo               : claude/consolidacao-2026-08
#   Caminho de Build   : docs/comercial/odoo
#   Arquivo Compose    : docker-compose.yml
#   (clicar "Gerar Chave SSH" e adicionar a chave em GitHub → repo phi → Settings → Deploy keys)
#
# DB user = 'odoo' (NÃO 'postgres') — evita o erro "Using the database user 'postgres' is a security risk".
# DB_PASSWORD tem um default de TESTE; troque em produção (o Postgres NÃO fica exposto à internet).

services:
  odoo-db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: "3VhQ2VatN80WyTowGc8vSww4XaCNFef2wynGVDNligc"
    volumes:
      - odoo-db:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19                       # versão 19; troque para odoo:18 se preferir
    depends_on:
      - crm_odoo-db
    environment:
      HOST: crm_odoo-db
      USER: odoo
      PASSWORD: "3VhQ2VatN80WyTowGc8vSww4XaCNFef2wynGVDNligc"
    command: odoo --proxy-mode --workers=0 --max-cron-threads=1
    # SEM 'ports:' — no EasyPanel a exposição é via Domains (Traefik alcança o container
    # na porta interna 8069 e faz o HTTPS). Publicar porta na mão gera aviso/conflito.
    expose:
      - "8069"
    volumes:
      - odoo-web:/var/lib/odoo           # filestore (anexos)
      - ./addons:/mnt/extra-addons       # módulo custom PHI (F2) — viaja junto pelo Git
    restart: unless-stopped

volumes:
  odoo-db:
  odoo-web:
