[options]
; ── Segurança (produção) ─────────────────────────────────────────────
; admin_passwd = senha-mestra do gerenciador de bancos. TROQUE por env/segredo do easypanel.
; NUNCA deixe o default. Quem tem isso cria/apaga bancos.
admin_passwd = CHANGE_ME_master_password

; Atrás do proxy do easypanel (HTTPS terminando no painel):
proxy_mode = True

; Em produção, esconder a tela de gerenciamento de bancos e travar no banco único:
list_db = False
; dbfilter = ^phi_crm$        ; (ativar depois de criar o banco definitivo)

; ── Banco ────────────────────────────────────────────────────────────
db_host = db
db_port = 5432
db_user = odoo
; db_password vem por env (PASSWORD) — não repetir aqui em texto.

; ── Módulos custom (F2) ──────────────────────────────────────────────
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; ── Workers (ajustar à RAM do easypanel; regra ~ (2*vCPU)+1) ──────────
; workers = 3
; limit_memory_soft = 671088640
; limit_memory_hard = 805306368
