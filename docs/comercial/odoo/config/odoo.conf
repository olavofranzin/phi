; PHI CRM — odoo.conf (ETAPA 2)
;
; ⚠️ Este arquivo NÃO é montado no primeiro boot. Veja o volume comentado no
; docker-compose.yml. Ordem correta:
;   1) Subir o compose SEM este arquivo  → criar o banco `phi_crm` pela tela.
;   2) Descomentar o volume  → redeploy  → o gerenciador de bancos fica trancado.
; Montar isto ANTES de criar o banco derruba a tela de criação e o Odoo responde
; "Database not found" — parece falha de conexão com o Postgres, mas não é.
;
; ⚠️ Este arquivo VAI PARA O GIT. Não coloque segredo aqui.
;   - `db_password` NÃO entra: vem da variável PASSWORD do compose.
;   - `admin_passwd` fica como placeholder de propósito. Com `list_db = False` o
;     gerenciador de bancos fica inacessível pela web, então a senha-mestra deixa
;     de ser superfície de ataque. Se um dia precisar dela, é para uso pontual via
;     linha de comando, não pela tela.

[options]
admin_passwd = CHANGE_ME_master_password

; HTTPS termina no Traefik do EasyPanel — sem isto, os links que o Odoo gera saem em http://
proxy_mode = True

; Produção: esconder o gerenciador de bancos e travar num banco único.
list_db = False
dbfilter = ^phi_crm$

; ── Banco ────────────────────────────────────────────────────────────
; `db` é o nome do serviço Postgres no docker-compose.yml deste diretório.
db_host = db
db_port = 5432
db_user = odoo
; db_password: vem da env PASSWORD (compose). Não repetir aqui.

; ── Módulos custom ───────────────────────────────────────────────────
; /mnt/extra-addons = ./addons deste repo (bind mount no compose) = onde vive phi_crm.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; ── Recursos (VPS KVM1, ~1,2 GB livres) ──────────────────────────────
; Modo threaded. Já vai como flag no `command:` do compose; repetido aqui para
; quando o arquivo estiver montado.
workers = 0
max_cron_threads = 1
